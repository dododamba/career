scheb_two_factor:
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
        - Symfony\Component\Security\Http\Authenticator\Token\RememberMeToken
    totp:
        enabled: true
        server_name: 'Suivi des Carrières'
        issuer: 'Suivi des Carrières'
        template: 'security/2fa_form.html.twig'
    backup_codes:
        enabled: true
